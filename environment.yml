name: code_status_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - numpy=2.1.*          # ABI-critical
  - numba=0.61.0         # matches NumPy 2.1
  - pandas=2.2.*
  - ydata-profiling=4.16.*   # adjust if you have a known-good
  - jupyterlab
  - ipykernel
  - pip
  - tableone
  - openpyxl